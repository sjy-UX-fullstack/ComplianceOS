version: "3.9"

services:
  # PostgreSQL 16 — mirrors AWS RDS ap-south-1
  postgres:
    image: postgres:16-alpine
    container_name: complianceos-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: complianceos
      POSTGRES_PASSWORD: local_dev_password_2026
      POSTGRES_DB: complianceos_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./packages/db/src/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceos"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis 7 — mirrors AWS ElastiCache
  redis:
    image: redis:7-alpine
    container_name: complianceos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — S3-compatible local store
  minio:
    image: minio/minio:latest
    container_name: complianceos-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: complianceos
      MINIO_ROOT_PASSWORD: local_dev_s3_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  minio_data:
